name: Run-tests-using-Pytest

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  schedule:
    - cron: "0 18 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
  
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python via uv
        run: uv python install ${{ matrix.python-version }}

      - name: Setup dependencies via uv
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check --ignore E701

      - name: Test with Pytest
        run: uv run coverage run -m pytest
        env:
          REDIS_ENABLE_CACHE: true
          REDIS_FLUSH_CACHE: true
          REDIS_TTL_CACHE: 900
          REDIS_URL: redis://localhost:6379

      - name: Generate report with Coverage
        run: uv run coverage report -m
