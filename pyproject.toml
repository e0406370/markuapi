[project]
name = "markuapi"
version = "1.1.1"
description = "Web scraper API for Filmarks Animes, Filmarks Dramas, and Filmarks Movies."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fake-useragent>=2.2.0",
    "fastapi>=0.116.1",
    "fastapi-cache2>=0.2.2",
    "httpx>=0.28.1",
    "logtail-python>=0.3.2",
    "lxml>=6.0.0",
    "msgspec>=0.19.0",
    "uvicorn[standard]>=0.35.0",
    "redis>=4.6.0",
    "requests>=2.32.4",
    "slowapi>=0.1.9"
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10.1",
    "jsonpath-ng>=1.6.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.7",
]

[tool.poetry]
packages = [{ include = "src" }]